# Push a tag such as v0.3.0 (release.ps1 does it) to publish a release with:
#   McpClientUI-<tag>-win-x64.zip       the Windows app, a self-contained single-file exe
#   McpClientUI-<tag>-osx-arm64.zip     "MCP Client.app" for Apple Silicon Macs
#   McpClientUI-<tag>-osx-x64.zip       "MCP Client.app" for Intel Macs
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  macos:
    strategy:
      matrix:
        rid: [osx-arm64, osx-x64]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish and package
        run: |
          version='${{ github.ref_name }}'
          version=${version#v}
          dotnet publish src/McpClientUI.Avalonia -c Release -r ${{ matrix.rid }} --self-contained \
            -p:Version=$version -o publish/McpClientUI
          bash src/McpClientUI.Avalonia/macOS/package-app.sh publish/McpClientUI "$version" publish
          ditto -c -k --keepParent "publish/MCP Client.app" "McpClientUI-${{ github.ref_name }}-${{ matrix.rid }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: McpClientUI-*.zip

  release:
    needs: macos
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish the Windows app
        run: >
          dotnet publish src/McpClientUI/McpClientUI.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -o publish

      - name: Zip
        shell: pwsh
        run: Compress-Archive publish/McpClientUI.exe "McpClientUI-${{ github.ref_name }}-win-x64.zip"

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" (Get-ChildItem McpClientUI-*.zip).FullName --title "${{ github.ref_name }}" --generate-notes
