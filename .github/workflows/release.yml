# Builds McpClientUI.exe twice and attaches both zips to the GitHub release for the pushed tag:
# a self-contained single file (no .NET needed, ~47 MB) and a small framework-dependent
# single file (~1 MB, needs the .NET 10 Desktop Runtime). WinForms can't be trimmed.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: >
          dotnet publish McpClientUI.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -o publish

      - name: Publish (needs .NET runtime)
        run: >
          dotnet publish McpClientUI.csproj
          -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true
          -p:DebugType=none
          -o publish-fd

      - name: Zip
        shell: pwsh
        run: |
          Compress-Archive publish/McpClientUI.exe "McpClientUI-${{ github.ref_name }}-win-x64.zip"
          Compress-Archive publish-fd/McpClientUI.exe "McpClientUI-${{ github.ref_name }}-win-x64-needs-dotnet10.zip"

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "McpClientUI-${{ github.ref_name }}-win-x64.zip" "McpClientUI-${{ github.ref_name }}-win-x64-needs-dotnet10.zip" --title "${{ github.ref_name }}" --generate-notes
